version: '3.8'

services:
  app:
    build: .
    environment:
      - FLAG=${FLAG}
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - internal
    restart: always

  redis:
    image: redis:7-alpine
    networks:
      - internal

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/challenge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/error.html:/usr/share/nginx/html/error.html:ro
    networks:
      - internal
      - external
    depends_on:
      - app

networks:
  internal:
    internal: true
  external:
