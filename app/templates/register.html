<!DOCTYPE html>
<html>
<head>
    <title>Internal Portal - Register</title>
    <link rel="stylesheet" href="/static/style.min.css">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h1>Internal Portal</h1>
            <h2>Register</h2>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            {% if message %}
            <div class="success">{{ message }}</div>
            {% endif %}
            <form method="POST" action="/register" id="registerForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <div class="form-group">
                    <label>Display Name</label>
                    <input type="text" name="display_name" required maxlength="120">
                </div>
                <input type="text" name="website" style="position:absolute;left:-9999px;opacity:0;" tabindex="-1" autocomplete="off">
                <input type="hidden" name="pow_nonce" id="powNonce">
                <input type="hidden" name="challenge" id="challenge">
                <button type="submit" id="submitBtn">Register</button>
            </form>
            <p class="link">Already have an account? <a href="/login">Login here</a></p>
        </div>
    </div>
    <script src="/static/app.min.js"></script>
</body>
</html>
