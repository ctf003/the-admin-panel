limit_req_zone $binary_remote_addr zone=register:10m rate=5r/h;
limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=60r/m;

server {
    listen 80;
    server_tokens off;
    
    add_header X-Auth-Hint "token-based-auth" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    if ($http_user_agent ~* "sqlmap|nikto|dirbuster|gobuster|wfuzz|hydra|nmap") {
        return 403;
    }

    location ~* \.(git|env|pyc|map)$ {
        return 404;
    }

    location ~* ^/(config|app\.py|__pycache__|requirements) {
        return 404;
    }

    error_page 400 403 404 500 /error.html;
    location = /error.html {
        root /usr/share/nginx/html;
        internal;
    }

    location /register {
        limit_req zone=register burst=2 nodelay;
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        limit_req zone=general burst=20;
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
